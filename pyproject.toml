
[project]
name = "llm-sampling-lab"
version = "0.1.0"
description = "Hands-on laboratory for LLM sampling strategies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
sampling-lab = "llm_sampling_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
