# The CLI is kept as an explicitly run service; the UI starts by default.
# Shared image and volumes preserve the existing CLI workflow.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: llm-sampling-lab:phase6
  working_dir: /app
  environment:
    GROQ_API_KEY: ${GROQ_API_KEY-}
    OPENAI_API_KEY: ${OPENAI_API_KEY-}
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./results:/app/results
    - ./settings.toml:/app/settings.toml:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  sampling-lab:
    <<: *app
    profiles: ["cli"]

  ui:
    <<: *app
    init: true
    entrypoint:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped
