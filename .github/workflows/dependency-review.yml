name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject newly introduced high-severity vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check changed dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
